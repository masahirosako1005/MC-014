<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ミニ推し！ 運営の管理画面</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/shared/mapedit.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="loginForm" class="card">
      <h1>ミニ推し！ 管理画面</h1>
      <label>ID <input name="id" autocomplete="username" required></label>
      <label>パスワード <input name="password" type="password" autocomplete="current-password" required></label>
      <p id="loginMsg" class="err"></p>
      <button type="submit">ログイン</button>
      <p class="muted">このPCからのみ接続できます。</p>
    </form>
  </div>
  <div id="app" class="hidden">
    <nav id="nav">
      <h1>ミニ推し！<small>運営</small></h1>
      <a href="#dashboard">ダッシュボード</a>
      <a href="#works">作品</a>
      <a href="#characters">キャラ設定</a>
      <a href="#map">マップ</a>
      <a href="#places">場所</a>
      <a href="#events">イベント</a>
      <a href="#weather">天気</a>
      <a href="#codes">獲得コード</a>
      <a href="#orgs">自治体のアカウント</a>
      <a href="#requests">自治体からの申請</a>
      <a href="#reports">解釈違いの報告</a>
      <a href="#users">ユーザー</a>
      <a href="#log">操作履歴</a>
      <a href="#spots">スポットDB</a>
      <button id="logout" type="button">ログアウト</button>
    </nav>
    <main id="main"></main>
  </div>
  <script src="/vendor/leaflet.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
